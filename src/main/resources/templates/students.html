<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }
        .container {
            width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        input {
            padding: 10px;
            margin: 6px 6px 6px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        button {
            padding: 10px 18px;
            background: #2196F3;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0b7dda;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #333;
            color: white;
        }
        .delete-btn {
            display: inline-block;
            background: red;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Manager</h2>

    <h3 th:text="${student.id} == null ? 'Add Student' : 'Edit Student'"></h3>
    <form th:action="${student.id} == null ? @{/students/add} : @{/students/update/{id}(id=${student.id})}" method="post" th:object="${student}">
        <input type="hidden" th:field="*{id}" />
        <input type="text" th:field="*{name}" placeholder="Name" required>
        <input type="number" th:field="*{age}" placeholder="Age" required>
        <input type="text" th:field="*{major}" placeholder="Major" required>
        <button type="submit" class="btn btn-primary" th:text="${student.id} == null ? 'Add Student' : 'Update Student'"></button>
        <a th:if="${student.id} != null" th:href="@{/students}" class="btn btn-secondary" style="margin-left: 8px;">Cancel</a>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Major</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.age}"></td>
                <td th:text="${s.major}"></td>
                <td>
                    <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-secondary" style="margin-right: 8px;">Edit</a>
                    <a th:href="@{/students/delete/{id}(id=${s.id})}" class="delete-btn">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
